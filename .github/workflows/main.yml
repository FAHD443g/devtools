name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build Swift Package App
        run: |
          xcodebuild build \
          -scheme "Devtools" \
          -destination "generic/platform=iOS" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

      - name: List Files (للتحقق)
        run: |
          echo "جاري البحث عن ملف التطبيق..."
          find build -name "*.app" -type d

      - name: Create IPA
        run: |
          mkdir -p Payload
          # هذا الأمر سيبحث عن أي ملف .app ويضعه في المجلد الصحيح
          find build -name "*.app" -type d -exec cp -R {} Payload/ \;
          
          # التحقق من أن المجلد ليس فارغاً
          if [ -z "$(ls -A Payload)" ]; then
             echo "خطأ: لم يتم العثور على ملفات داخل Payload"
             exit 1
          fi
          
          zip -r Devtools.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Real-Devtools-App
          path: Devtools.ipa
