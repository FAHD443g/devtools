name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build Project
        run: |
          xcodebuild build \
          -scheme "Devtools" \
          -destination "generic/platform=iOS" \
          -derivedDataPath output \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

      - name: Global Search & Pack
        run: |
          mkdir -p Payload
          # البحث في كل مكان عن ملف .app الناتج
          APP_PATH=$(find output -name "*.app" -type d | grep -v "Index" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "الملف لسه مختفي! بجرب أبحث في المجلدات الرئيسية.."
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "لقيته! المسار هو: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r Devtools.ipa Payload
          else
            echo "ما حصلت شي.. تأكد من اسم الـ Scheme في Package.swift"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Full-App-Package
          path: Devtools.ipa
