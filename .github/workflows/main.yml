name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build App
        run: |
          xcodebuild build \
          -scheme "devtools" \
          -destination "generic/platform=iOS" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

      - name: Prepare IPA Folder
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/*.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyFinalApp
          path: App.ipa
