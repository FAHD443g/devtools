name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build for iOS Device
        run: |
          xcodebuild build \
          -scheme "Devtools" \
          -destination "generic/platform=iOS" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Check and Pack IPA
        run: |
          mkdir -p Payload
          # البحث عن ملف الـ .app في مجلد البناء الجديد
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Application file (.app) not found!"
            exit 1
          fi
          
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r Devtools.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Devtools-Real-File
          path: Devtools.ipa
